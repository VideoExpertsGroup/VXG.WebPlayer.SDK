		<script>
			window.sessNameCh = 'example_cloudplayersdk2_ch';

			var mainContainer ;
			var id;
			var id_ = 0;
			var newDiv;
			const myMap = new Map();


			function GetFreeCell()
			{
				const gridCells = document.querySelectorAll('.grid-cell');	

				for (let index = 0; index < gridCells.length; index++) {
					const cell = gridCells[index];
					console.log(`Cell ${index + 1}:`, cell);

					// Check if the cell does not have the 'player' attribute
					if (!cell.PlayerDiv) {
						console.log(`Free cell found at index ${index + 1}`);
						return cell; // Return the first free cell
					}
				}
				return null;
			}

			function GetPlayer()
			{
				const gridCells = document.querySelectorAll('.grid-cell');	

				for (let index = 0; index < gridCells.length; index++) {
					const cell = gridCells[index];
					console.log(`Cell ${index + 1}:`, cell);

					// Check if the cell does not have the 'player' attribute
					if (cell.PlayerDiv) {
						console.log(`Free cell found at index ${index + 1}`);
						return cell; // Return the first free cell
					}
				}
				return null;
			}

			function CreateGrid()
				{
					const gridContainer = document.getElementById('grid-container');

					// Generate 16x16 grid
					for (let i = 0; i < 4 * 4; i++) {
						const cell = document.createElement('div');
						cell.classList.add('grid-cell');
						gridContainer.appendChild(cell);
					}	
				}

			

			function createPlayer(token, recording, main_div)
			{

					// Create a new div element
					newDiv = document.createElement("span");

					// Add desired classes to the new div element		
					newDiv.className = "flex-container flex-item";

					// Set a unique ID for the new div (optional, e.g., "player8")
					newDiv.id = `player${id_}`;
					id_ = id_ + 1;	



					main_div.appendChild(newDiv);


					if (recording)
					window.player = new CloudPlayerSDK(newDiv.id , {
					autohide: -1,
					timeline: false,
					calendar: false,
					calendar: false,
					live_only: true,
					hideTime:true,
					disableGetClip:true,
					disableGetShot:true,
					disableSdCard:true,
					disableBackwardAudio:true,
					loaderTimeout: 15000, 
					mute:true,
					});
					else
					window.player = new CloudPlayerSDK(newDiv.id , {
					loaderTimeout: 15000,		
					autohide: 30000,
					timeline: true,
					calendar: true,
					hideTime:true,
					disableGetClip:true,
					disableGetShot:true,
					disableSdCard:true,
					disableBackwardAudio:true,
					mute:true,

					});

					player.setSource(token);
					player.play();


					newDiv.player = player;
					main_div.PlayerDiv = newDiv;
					
			}

			function destroyPlayer(divPlayer)
			{
					
					divPlayer.player.stop("");
					divPlayer.player.destroy();

					playerToRemove = document.getElementById(divPlayer.id);
					if (playerToRemove) {
 					   // Remove the child
    					divPlayer.removeChild(playerToRemove);
					}


			}


			$(document).ready(function () {
				try {  var sChannel = window.sessionStorage.getItem(window.sessNameCh);
					$('#channel').val(sChannel !== null ? sChannel : ''); } catch (e) {}


				CreateGrid();

				$('#play_channel').unbind().bind('click', function(){
					var channelElem = $('#channel');
					var channel = channelElem.val();
					if (!channel || channel === '') {
						channelElem.css('background-color', 'red').focus();
						setTimeout(function () {channelElem.css('background-color', '');},200);
						return;
					}

					const checkbox = document.getElementById("recording");
					
					cell = GetFreeCell();
					createPlayer(channel,checkbox.checked,cell);


					try { window.sessionStorage.setItem(window.sessNameCh, channel) } catch(e) { }

					//myMap.appendChild
				});

				$('#close_channel').unbind().bind('click', function(){

					cell = GetPlayer();	
					destroyPlayer(cell.PlayerDiv);
					cell.PlayerDiv = null;
					
				});
			});
		</script>
